name: Python package tests

on: [push]

jobs:
  build:

    runs-on: ubuntu-20.04
    strategy:
      matrix:
        container-name:
          - almalinux:9
    container:
      image: ${{ matrix.container-name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies for Python
      run: |
        dnf install -y dnf-plugins-core
        dnf install -y gcc openssl-devel bzip2-devel libffi-devel zlib-devel make
        dnf install -y git

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Torque
      run: |
        dnf install -y epel-release
        dnf install -y torque torque-client torque-devel torque-drmaa torque-mom torque-server torque-scheduler

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade setuptools wheel
        pip install ".[all]"

    - name: Unit tests
      run: |
        python -m unittest discover --verbose --catch --start-directory tests/unit
