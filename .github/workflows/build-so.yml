name: Build PBS shared objects

on:
  # pull_request:
  #   branches:
  #     - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.10'

jobs:
  build-so:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64
            runner-os: ubuntu-24.04
          - platform: aarch64
            runner-os: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner-os }}

    container:
      image: almalinux:9

    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout surfsara-pbs-python (wrap sources)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mat3ra/surfsara-pbs-python
          ref: main
          path: surfsara-pbs-python

      - name: Install build dependencies
        run: |
          dnf install -y \
            bzip2-devel \
            gcc \
            gcc-c++ \
            git \
            libffi-devel \
            make \
            openssl-devel \
            patch \
            readline-devel \
            sqlite-devel \
            which \
            xz-devel \
            zlib-devel

      - name: Configure Mat3ra Torque repo
        run: |
          cat > /etc/yum.repos.d/mat3ra-test.repo <<'EOF'
          [Mat3ra-Test]
          name=Custom packages for testing
          baseurl=https://mat3ra.github.io/rpm-repo/almalinux/9/$basearch
          enabled=1
          gpgcheck=0
          priority=1
          EOF
          # Strip the YAML-leading indent that heredoc captured above
          sed -i 's/^[[:space:]]\+//' /etc/yum.repos.d/mat3ra-test.repo
          dnf install -y torque torque-devel
          ls -l /usr/local/include/torque/pbs_ifl.h /usr/local/lib64/libtorque.so*

      - name: Install Python ${{ env.PYTHON_VERSION }} via pyenv
        run: |
          export PYENV_ROOT=/usr/local/pyenv
          curl -fsSL https://pyenv.run | bash
          export PATH="${PYENV_ROOT}/bin:${PYENV_ROOT}/shims:${PATH}"
          pyenv install "${{ env.PYTHON_VERSION }}"
          pyenv global "${{ env.PYTHON_VERSION }}"
          python -m pip install --upgrade 'pip==24.0' setuptools wheel
          python --version
          echo "PYENV_ROOT=${PYENV_ROOT}" >> "${GITHUB_ENV}"
          echo "${PYENV_ROOT}/bin" >> "${GITHUB_PATH}"
          echo "${PYENV_ROOT}/shims" >> "${GITHUB_PATH}"

      - name: Build _pbs shared object
        run: |
          export PATH="${PYENV_ROOT}/bin:${PYENV_ROOT}/shims:${PATH}"
          export LD_LIBRARY_PATH=/usr/local/lib64:${LD_LIBRARY_PATH:-}
          chmod +x scripts/build-pbs-c-bindings.sh
          SURFSARA_SRC="${PWD}/surfsara-pbs-python" \
            PYTHON=python \
            OUT_DIR=dist \
            scripts/build-pbs-c-bindings.sh
          SO="dist/_pbs.cpython-310-${{ matrix.platform }}-linux-gnu.so"
          test -f "${SO}"
          ls -lh "${SO}"

      - name: Upload compiled shared object as build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: _pbs.cpython-310-${{ matrix.platform }}-linux-gnu.so
          path: dist/_pbs.cpython-310-${{ matrix.platform }}-linux-gnu.so
          if-no-files-found: error
